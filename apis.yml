aid: beds24
url: https://raw.githubusercontent.com/api-evangelist/beds24/refs/heads/main/apis.yml
name: Beds24
kind: company
description: Beds24 is a vacation rental and hotel channel manager, property management
  system (PMS), and online booking engine. It synchronizes availability, rates, and
  reservations across OTAs such as Booking.com, Airbnb, Expedia, Vrbo, and Google,
  and exposes a documented REST API (v2 at api.beds24.com/v2, with a legacy JSON/XML
  v1) for reading and writing bookings, properties, room inventory, availability
  calendars, prices, invoices, channels, and account data. API V2 uses expiring
  access tokens generated from refresh tokens, scoped permissions, optional IP
  whitelisting, and a credit-based rate limit enforced per account over a rolling
  5-minute window.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Vacation Rental
- Hotel
- Channel Manager
- Property Management System
- Booking Engine
- Hospitality
- Reservations
