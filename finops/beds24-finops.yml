description: >-
  FinOps view of Beds24 spend. Beds24 bills on a pay-as-you-go, per-rental basis:
  a monthly base fee for a single rental, incremental per-property and per-rental
  fees, a per-link monthly fee for each channel manager connection, and an
  optional monthly fee for the private-label booking engine. The REST API is
  included with a paid account at no separate charge, so the direct cost driver
  of API usage is the underlying platform subscription (number of rentals and
  channel links) rather than per-call fees. The main operational constraint on
  API consumption is the account-level 5-minute credit limit, not a metered
  invoice line.
notes: >-
  Because there is no per-API-call charge, API cost optimization at Beds24 is
  about (1) right-sizing the number of active rentals and channel links you pay
  for monthly, and (2) staying within the credit limit to avoid throttling.
  Figures are indicative; reconcile against the Beds24 pricing calculator and a
  live invoice.
