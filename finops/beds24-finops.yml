principles:
- name: Visibility
  description: Track the number of billable rentals and channel links per account and property, and monitor API credit consumption via the x-request-cost and x-five-min-limit-remaining headers.
- name: Allocation
  description: Map rentals and channel links to properties and owners so the monthly platform fee can be allocated to the right cost center or property owner.
- name: Optimization
  description: Deactivate unused rentals and channel links, batch and cache bulk calendar/price reads to stay within the credit limit, and avoid redundant polling.
- name: Accountability
  description: Assign an owner per property/account, review the monthly Beds24 invoice against active rentals and links, and alert when API usage approaches the credit limit.
